name: ci pipeline to build the scource code with maven 
on: 
  push:
    branches: master
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: checkout code
        uses: actions/checkout@v4
      
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'adopt'
          java-version: '21'   # Updated Java versio
      - name: maven validate
        run: mvn validate
      - name: maven compile
        run: mvn compile 
      - name: maven test
        run: mvn test
      - name: maven package
        run: mvn package
      - name: SonarQube Scan
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        run: |
                mvn sonar:sonar \
                  -Dsonar.host.url="${{ secrets.SONAR_HOST_URL }}" \
                  -Dsonar.token="${{ secrets.SONAR_TOKEN }}"

