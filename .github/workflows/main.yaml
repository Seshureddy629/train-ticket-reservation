name: ci pipeline to build the scource code with maven 
on: 
  push:
    branches: master
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: checkout code
        uses: actions/checkout@v4
      
      - name: set-up jdk
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'   # Updated Java versio
      - name: maven validate
        run: mvn validate
      - name: maven compile
        run: mvn compile 
      - name: maven test
        run: mvn test
      - name: maven package
        run: mvn package
      - name: SonarQube Scan
        uses: sonarsource/sonarqube-scan-action@master
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

