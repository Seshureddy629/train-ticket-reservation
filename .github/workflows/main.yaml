name: ci pipeline to build the scource code with maven 
on: 
  push:
    branches: master
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: checkout code
        uses: actions/checkout@v4
      
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'adopt'
          java-version: '21'   # Updated Java versio
      - name: maven validate
        run: mvn validate
      - name: maven compile
        run: mvn compile 
      - name: maven test
        run: mvn test
      - name: maven package
        run: mvn package
      - name: Authenticate with Nexus
        run: |
                mkdir -p ~/.m2
                cat <<EOF > ~/.m2/settings.xml
                <settings>
                  <servers>
                    <server>
                      <id>nexus</id>
                      <username>${{ secrets.NEXUS_USERNAME }}</username>
                      <password>${{ secrets.NEXUS_PASSWORD }}</password>
                    </server>
                  </servers>
                </settings>
                EOF
      
       - name: Upload Artifact to Nexus
         run: mvn deploy -DaltDeploymentRepository=nexus::default::${{ secrets.NEXUS_REPO_URL }}

