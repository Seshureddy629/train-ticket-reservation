name: ci pipeline to build the scource code with maven 
on: 
  push:
    branches: master
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: checkout code
        uses: actions/checkout@v4
      
      - name: set-up jdk
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'   # Updated Java versio
      - name: maven validate
        run: mvn validate
      - name: maven compile
        run: mvn compile 
      - name: maven test
        run: mvn test
      - name: maven package
        run: mvn package
      - name: SonarQube Scan
        run: |
            mvn sonar:sonar \
              -Dsonar.projectKey=train-ticket-reservation \
              -Dsonar.host.url="${{ secrets.SONAR_HOST_URL }}" \
              -Dsonar.token="${{ secrets.SONAR_TOKEN }}"

